<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>UG Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg, #e0e7ff, #f8fafc);
        }

        .card {
            border-radius: 15px;
        }

        .section-title {
            font-weight: 600;
            margin-bottom: 10px;
        }
    </style>

</head>

<body>

    <div class="container mt-5">
        <div class="card shadow-lg p-4">

            <h3 class="text-center mb-3">Student Registration</h3>

            <!-- FLASH MESSAGES -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, msg in messages %}
            <div class="alert alert-{{category}}">{{ msg }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{url_for('register_student')}}">

                <!-- 👤 PERSONAL DETAILS -->
                <div class="section-title text-primary">👤 Personal Details</div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label"> Email</label>

                        <input type="email" name="email" class="form-control" placeholder="  Enter your Email" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" name="phone" pattern="[0-9]{10}" class="form-control"
                            placeholder="Phone (10 digits)" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="gender" class="form-label">Gender</label>

                        <select name="gender" class="form-select">
                            <option value="">Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="dob" class="form-label">Date of Birth</label>

                        <input type="date" name="dob" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2" placeholder="Address"></textarea>
                    </div>

                </div>

                <hr>

                <!--  ACADEMIC DETAILS -->
                <div class="section-title text-success">Academic Details</div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="department" class="form-label">Course</label>

                        <select name="department" class="form-select" required>
                            <option value="">Course</option>
                            <option>BCA</option>
                            <option>BCOM</option>
                            <option>BBA</option>
                            <option>BSC</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="sem" class="form-label">Semester</label>
                        <input type="number" name="sem" min="1" max="6" class="form-control"
                            placeholder="Semester (1-6)" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="batch" class="form-label">Batch</label>
                        <input type="text" name="batch" pattern="\d{4}-\d{4}" class="form-control"
                            placeholder="Batch (2023-2026)" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="cgpa" class="form-label">CGPA</label>
                        <input type="number" step="0.01" min="0" max="10" name="cgpa" class="form-control"
                            placeholder="CGPA (0-10)">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="backlogs" class="form-label">Backlogs</label>
                        <input type="number" min="0" name="backlogs" value="0" class="form-control"
                            placeholder="Backlogs">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="tenth_percent" class="form-label">10th Percentage</label>
                        <input type="number" step="0.01" min="0" max="100" name="tenth_percent" class="form-control"
                            placeholder="10th Percentage">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="twelfth_percent" class="form-label">12th Percentage</label>

                        <input type="number" step="0.01" min="0" max="100" name="twelfth_percent" class="form-control"
                            placeholder="12th Percentage">
                    </div>
                </div>

                <hr>
<!--login credential section-->
                <div class="section-title text-danger">Login Credentials</div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">Registeration Number</label>
                        <input type="text" name="regno" class="form-control" placeholder="Username" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label"> Create Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                    </div>

                <button type="submit" class="btn btn-dark w-100">
                    🚀 Register
                </button>

                <p class="text-center mt-3">
                    Already registered? <a href="#login">Login</a>
                </p>

            </form>
        </div>
    </div>

</body>

</html>
