<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPO Dashboard - BCA Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fff8f0; }
        .navbar-custom { background: linear-gradient(135deg, #f7971e, #ffd200); }
        .navbar-custom .navbar-brand, .navbar-custom .navbar-text { color: #3a2200 !important; font-weight: 600; }
        .welcome-card { background: linear-gradient(135deg, #f7971e, #ffd200); color: #3a2200; border-radius: 16px; padding: 28px; margin-bottom: 24px; }
        .card { border: none; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.07); }
    </style>
</head>
<body>

<nav class="navbar navbar-custom px-4">
    <span class="navbar-brand">💼 TPO Dashboard</span>
    <div class="ms-auto d-flex align-items-center gap-3">
        <span class="navbar-text">{{ user.full_name }}</span>
        <a href="/logout" class="btn btn-sm btn-dark">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="welcome-card">
        <h4 class="fw-bold mb-1">Welcome, {{ user.full_name }} 👋</h4>
        <p style="opacity:0.75">Training & Placement Officer</p>
    </div>
    <div class="row g-3">
        <div class="col-md-4"><div class="card p-4 text-center"><div style="font-size:2rem">🏢</div><h6 class="fw-bold mt-2">Company Listings</h6></div></div>
        <div class="col-md-4"><div class="card p-4 text-center"><div style="font-size:2rem">📄</div><h6 class="fw-bold mt-2">Student Resumes</h6></div></div>
        <div class="col-md-4"><div class="card p-4 text-center"><div style="font-size:2rem">📅</div><h6 class="fw-bold mt-2">Drive Schedule</h6></div></div>
    </div>
</div>

</body>
</html>
